# Copy to .github/workflows/unity-release.yml in a Unity game repository.
# Produces version-tagged build artifacts; store publishing is intentionally separate.
name: Unity Release Build
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag (for example v1.2.0)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: unity-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate-tag:
    name: Validate release ref
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ref.outputs.tag }}
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      - id: ref
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_REF: ${{ github.ref }}
          INPUT_TAG: ${{ inputs.release_tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$PUSH_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "::error::Manual release dispatch must use the repository default branch ($DEFAULT_BRANCH)."
            exit 1
          fi
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$INPUT_TAG"
            if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::Tag must follow vMAJOR.MINOR.PATCH with an optional prerelease suffix."
              exit 1
            fi
          else
            tag="${PUSH_REF#refs/tags/}"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag must follow vMAJOR.MINOR.PATCH with an optional prerelease suffix."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Checkout exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.ref.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Record immutable release commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  editmode:
    name: Release EditMode tests
    environment: release
    needs: validate-tag
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-tag.outputs.commit }}
          lfs: true
          fetch-depth: 0
          persist-credentials: false
      - id: tests
        uses: game-ci/unity-test-runner@fa6ced25861c16ef56187828c43f76d00df43a23 # v4.3.2
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: ${{ vars.UNITY_PROJECT_PATH || '.' }}
          unityVersion: auto
          testMode: editmode
          githubToken: ''
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-editmode-${{ needs.validate-tag.outputs.tag }}
          path: ${{ steps.tests.outputs.artifactsPath }}
          if-no-files-found: warn
          retention-days: 30
  playmode:
    name: Release PlayMode tests
    environment: release
    needs: validate-tag
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-tag.outputs.commit }}
          lfs: true
          fetch-depth: 0
          persist-credentials: false
      - id: tests
        uses: game-ci/unity-test-runner@fa6ced25861c16ef56187828c43f76d00df43a23 # v4.3.2
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: ${{ vars.UNITY_PROJECT_PATH || '.' }}
          unityVersion: auto
          testMode: playmode
          githubToken: ''
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-playmode-${{ needs.validate-tag.outputs.tag }}
          path: ${{ steps.tests.outputs.artifactsPath }}
          if-no-files-found: warn
          retention-days: 30
  build:
    name: Build ${{ matrix.platform }}
    needs: [validate-tag, editmode, playmode]
    strategy:
      fail-fast: false
      matrix:
        platform: [StandaloneLinux64, Android]
    runs-on: ubuntu-latest
    environment: release # Configure required reviewers and platform signing secrets here.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-tag.outputs.commit }}
          lfs: true
          fetch-depth: 0
          persist-credentials: false
      - uses: game-ci/unity-builder@eb1b9fba120c6e62c9fb7a7a81d6c107ce004c45 # v6.0.0
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: ${{ vars.UNITY_PROJECT_PATH || '.' }}
          unityVersion: auto
          targetPlatform: ${{ matrix.platform }}
      - name: Add release provenance and checksums
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.validate-tag.outputs.tag }}
          PLATFORM: ${{ matrix.platform }}
          RELEASE_COMMIT: ${{ needs.validate-tag.outputs.commit }}
        run: |
          set -euo pipefail
          printf 'tag=%s\ncommit=%s\nplatform=%s\n' "$RELEASE_TAG" "$RELEASE_COMMIT" "$PLATFORM" > build/RELEASE-METADATA.txt
          find build -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > build/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ needs.validate-tag.outputs.tag }}-${{ matrix.platform }}
          path: build
          if-no-files-found: error
          retention-days: 90
