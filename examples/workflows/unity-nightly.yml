# Copy to .github/workflows/unity-nightly.yml in a Unity game repository.
name: Unity Nightly Regression
on:
  schedule:
    - cron: "0 3 * * *" # Daily at 03:00 UTC; adjust for your team.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: unity-nightly-${{ github.workflow }-${{ github.ref }
  cancel-in-progress: true
jobs:
  editmode:
    name: Nightly EditMode regression
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true
      - id: tests
        uses: game-ci/unity-test-runner@32e57712352b500e17974b245a6dce9e11a73213 # v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }
        with:
          projectPath: ${{ vars.UNITY_PROJECT_PATH || '.' }
          unityVersion: auto
          testMode: editmode
          githubToken: ''
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nightly-editmode-${{ github.sha }
          path: ${{ steps.tests.outputs.artifactsPath }
          if-no-files-found: warn
          retention-days: 14
  playmode:
    name: Nightly PlayMode regression
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true
      - id: tests
        uses: game-ci/unity-test-runner@32e57712352b500e17974b245a6dce9e11a73213 # v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }
        with:
          projectPath: ${{ vars.UNITY_PROJECT_PATH || '.' }
          unityVersion: auto
          testMode: playmode
          githubToken: ''
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nightly-playmode-${{ github.sha }
          path: ${{ steps.tests.outputs.artifactsPath }
          if-no-files-found: warn
          retention-days: 14
  platform-builds:
    name: Nightly ${{ matrix.platform } build
    needs: [editmode, playmode]
    strategy:
      fail-fast: false
      matrix:
        platform: [StandaloneLinux64, Android]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true
      - uses: game-ci/unity-builder@4423ee75828dff56037d1d1cfdac6b68e3a6ba00 # v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }
        with:
          projectPath: ${{ vars.UNITY_PROJECT_PATH || '.' }
          unityVersion: auto
          targetPlatform: ${{ matrix.platform }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nightly-${{ matrix.platform }-${{ github.sha }
          path: build
          if-no-files-found: error
          retention-days: 7
