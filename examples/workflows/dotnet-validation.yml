# Copy to .github/workflows/dotnet-validation.yml.
# Configure DOTNET_PROJECT_PATHS as a newline-separated repository variable.
# Keep Unity-generated .sln/.csproj files out of this list: Unity code compiles in the Editor workflow.
name: .NET Validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dotnet-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: .NET build, test and format
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOTNET_PROJECT_PATHS: ${{ vars.DOTNET_PROJECT_PATHS }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check whether standalone .NET projects are configured
        id: projects
        shell: bash
        run: |
          if [ -z "${DOTNET_PROJECT_PATHS//[$'\\t\\r\\n ']/}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "No standalone .NET project paths configured; Unity C# compilation is checked by Unity CI."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up .NET SDK
        if: steps.projects.outputs.configured == 'true'
        uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v5
        with:
          dotnet-version: 8.0.x

      - name: Restore, build, test and verify formatting
        if: steps.projects.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r project; do
            project="$(echo "$project" | xargs)"
            [ -z "$project" ] && continue
            if [ ! -f "$project" ]; then
              echo "::error::Configured .NET project does not exist: $project"
              exit 1
            fi

            case "$project" in
              *.sln|*.slnx|*.csproj) ;;
              *)
                echo "::error::Expected a .sln, .slnx, or .csproj path: $project"
                exit 1
                ;;
            esac

            echo "::group::Validate $project"
            dotnet restore "$project"
            dotnet build "$project" --configuration Release --no-restore
            if [[ "$project" == *.sln || "$project" == *.slnx ]]; then
              dotnet test "$project" --configuration Release --no-build
            elif grep -q '<IsTestProject>true</IsTestProject>' "$project"; then
              dotnet test "$project" --configuration Release --no-build
            fi
            dotnet format whitespace "$project" --verify-no-changes --no-restore
            echo "::endgroup::"
          done <<< "$DOTNET_PROJECT_PATHS"

      - name: Report Unity C# compile coverage
        run: |
          echo "Unity C# compilation is validated by the Unity Editor import/compile and EditMode test job in unity-ci.yml."
          echo "This workflow validates only explicitly configured standalone .NET projects.";
