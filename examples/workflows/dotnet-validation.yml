# Copy to .github/workflows/dotnet-validation.yml.
# Configure DOTNET_PROJECT_PATHS and optional DOTNET_TEST_PROJECT_PATHS as newline-separated repository variables.
# DOTNET_SDK_VERSION defaults to 8.0.x; set it to the SDK required by your standalone .NET projects.
# Keep Unity-generated .sln/.csproj files out of these lists: Unity code compiles in the Editor workflow.
name: .NET Validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dotnet-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: .NET build, test, analyzers and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DOTNET_PROJECT_PATHS: ${{ vars.DOTNET_PROJECT_PATHS }}
      DOTNET_TEST_PROJECT_PATHS: ${{ vars.DOTNET_TEST_PROJECT_PATHS }}
      DOTNET_SDK_VERSION: ${{ vars.DOTNET_SDK_VERSION || '8.0.x' }}
      DOTNET_RUN_VULNERABILITY_AUDIT: ${{ vars.DOTNET_RUN_VULNERABILITY_AUDIT || 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check whether standalone .NET projects are configured
        id: projects
        shell: bash
        run: |
          if [[ -z "${DOTNET_PROJECT_PATHS}${DOTNET_TEST_PROJECT_PATHS}" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "No standalone .NET project paths configured; Unity C# compilation is checked by Unity CI."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up .NET SDK
        if: steps.projects.outputs.configured == 'true'
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

      - name: Restore, build, analyze and verify formatting
        if: steps.projects.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r project; do
            project="$(echo "$project" | xargs)"
            [ -z "$project" ] && continue
            if [ ! -f "$project" ]; then
              echo "::error::Configured .NET project does not exist: $project"
              exit 1
            fi
            case "$project" in
              *.sln|*.slnx|*.csproj) ;;
              *) echo "::error::Expected a .sln, .slnx or .csproj path: $project"; exit 1 ;;
            esac
            echo "::group::Validate $project"
            dotnet restore "$project"
            dotnet build "$project" --configuration Release --no-restore
            dotnet format whitespace "$project" --verify-no-changes --no-restore
            dotnet format analyzers "$project" --verify-no-changes --no-restore
            if [[ "$DOTNET_RUN_VULNERABILITY_AUDIT" == "true" ]]; then
              dotnet list "$project" package --vulnerable --include-transitive
            fi
            echo "::endgroup::"
          done <<< "$DOTNET_PROJECT_PATHS"

          while IFS= read -r test_project; do
            test_project="$(echo "$test_project" | xargs)"
            [ -z "$test_project" ] && continue
            if [ ! -f "$test_project" ]; then
              echo "::error::Configured .NET test project does not exist: $test_project"
              exit 1
            fi
            echo "::group::Test $test_project"
            dotnet test "$test_project" --configuration Release
            echo "::endgroup::"
          done <<< "$DOTNET_TEST_PROJECT_PATHS"

      - name: Report Unity C# compile coverage
        run: |
          echo "Unity C# compilation is validated by the Unity Editor import/compile and EditMode test job in unity-ci.yml."
          echo "This workflow validates only explicitly configured standalone .NET projects."
